<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 6 — Quiz JavaScript</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="container">
        <h1>Quiz de JavaScript</h1>

        <!-- Barra de progresso -->
        <div class="progresso">
            <div class="progresso-barra" id="barra" style="width: 0%"></div>
        </div>
        <div class="info-quiz" id="info">Pergunta 1 de 5</div>

        <!-- Área do quiz (perguntas + opções) -->
        <div id="area-quiz">
            <div id="pergunta"></div>
            <div class="opcoes" id="opcoes"></div>
            <button id="btn-proxima">Próxima Pergunta →</button>
        </div>

        <!-- Tela de resultado (oculta até o final) -->
        <div class="resultado-final" id="resultado-final">
            <h2>Quiz Finalizado!</h2>
            <div class="nota" id="nota-final"></div>
            <p id="feedback-final"></p>
            <button id="btn-refazer" style="padding:12px 24px;font-size:1rem;background:#2c3e50;color:white;border:none;border-radius:6px;cursor:pointer;margin-top:1rem">Refazer Quiz</button>
        </div>
    </div>
<script src="assets/script.js"></script>
</body>
</html>
