<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 2 — Calculadora Simples</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora</h1>

        <!-- Primeiro número -->
        <input type="number" id="num1" placeholder="Primeiro número">

        <!-- Seletor de operação — o usuário escolhe uma das 4 operações -->
        <select id="operacao">
            <option value="+">+ Somar</option>
            <option value="-">− Subtrair</option>
            <option value="*">× Multiplicar</option>
            <option value="/">÷ Dividir</option>
        </select>

        <!-- Segundo número -->
        <input type="number" id="num2" placeholder="Segundo número">

        <button id="btn-calcular">Calcular</button>

        <div id="resultado">Resultado aparecerá aqui</div>
    </div>
  <script src="assets/script.js"></script>
</body>
</html>
