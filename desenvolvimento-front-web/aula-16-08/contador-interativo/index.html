<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 3 — Contador Interativo</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <div class="container">
        <h1>Contador</h1>

        <!-- Número exibido — começa em 0 -->
        <div id="numero">0</div>

        <!-- Três botões lado a lado -->
        <div class="botoes">
            <button class="btn-menos" id="btn-menos">−</button>
            <button class="btn-reset" id="btn-reset">Reset</button>
            <button class="btn-mais"  id="btn-mais">+</button>
        </div>
    </div>
<script src="assets/script.js"></script>
</body>
</html>
